<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="990" viewBox="0 0 1120 990" role="img" aria-labelledby="title description">
<title id="title">AirPlay Speaker system architecture</title>
<desc id="description">An AirPlay sender reaches three shared C services. Discovery advertises RAOP and AirPlay. Session control routes AirPlay 2 requests before falling back to AirPlay 1. Both protocol paths publish session state to one audio pipeline, which uses platform networking, operating system, and PCM output interfaces.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#60748e"/></marker>
  <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker>
  <marker id="violet" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7c3aed"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#18314b}.title{font-size:27px;font-weight:700;letter-spacing:-.4px}.subtitle{font-size:15px;fill:#586d85}.label{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#506886}.heading{font-size:18px;font-weight:700}.body{font-size:14px;fill:#526780}.small{font-size:13px;fill:#526780}.code{font-family:Consolas,monospace;font-size:13px;fill:#23558c}.white{fill:#fff}.light{fill:#c9d8ed}.ap1{fill:#1d4ed8}.ap2{fill:#6d28d9}
</style>

<rect width="1120" height="990" rx="24" fill="#f7f9fc"/>
<text x="36" y="45" class="title">AirPlay 1 and AirPlay 2 share one portable core</text>
<text x="36" y="73" class="subtitle">Protocol-specific control and transport feed one session model, scheduler, decoder, and platform output.</text>
<rect x="838" y="28" width="246" height="53" rx="12" fill="#e8eef9" stroke="#d4dff0"/>
<text x="961" y="50" class="code" text-anchor="middle">airplay_config.h</text>
<text x="961" y="69" class="body" text-anchor="middle">Identity · ports · memory · tasks</text>

