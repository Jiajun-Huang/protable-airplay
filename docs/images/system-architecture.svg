<text x="924" y="278" class="heading" text-anchor="middle">Audio service</text>
<text x="924" y="303" class="code" text-anchor="middle">airplay_audio_main</text>
<text x="924" y="328" class="small" text-anchor="middle">Session snapshots · device owner</text>

<path d="M560 349 V365 H286 V381" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path d="M560 365 H834 V381" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#violet)"/>

<rect x="56" y="383" width="460" height="150" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
<text x="286" y="412" class="heading ap1" text-anchor="middle">AirPlay 1 / RAOP</text>
<text x="286" y="438" class="code" text-anchor="middle">ANNOUNCE SDP → SETUP → RECORD</text>
<text x="286" y="465" class="body" text-anchor="middle">RSA-wrapped AES key · AES-128-CBC packets</text>
<text x="286" y="490" class="body" text-anchor="middle">Realtime ALAC / PCM over UDP</text>
<text x="286" y="515" class="body" text-anchor="middle">NTP timing exchange + RTP sync anchor</text>

<rect x="604" y="383" width="460" height="150" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/>
<text x="834" y="412" class="heading ap2" text-anchor="middle">AirPlay 2</text>
<text x="834" y="438" class="code" text-anchor="middle">FairPlay → transient pairing → encrypted RTSP</text>
<text x="834" y="465" class="body" text-anchor="middle">Binary plist SETUP · ChaCha20-Poly1305 audio</text>
<text x="834" y="490" class="body" text-anchor="middle">Type 96: UDP ALAC · Type 103: TCP AAC</text>
<text x="834" y="515" class="body" text-anchor="middle">PTP clock + RTP playback anchor</text>

<path d="M286 533 V551 H560" fill="none" stroke="#2563eb" stroke-width="2"/>
<path d="M834 533 V551 H560" fill="none" stroke="#7c3aed" stroke-width="2"/>
