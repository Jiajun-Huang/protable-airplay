<text x="196" y="303" class="code" text-anchor="middle">airplay_mdns_main</text>
<text x="196" y="328" class="small" text-anchor="middle">_raop._tcp · _airplay._tcp</text>

<rect x="420" y="249" width="280" height="100" rx="12" fill="#fff" stroke="#d9e2ef"/>
<text x="560" y="278" class="heading" text-anchor="middle">Session control</text>
<text x="560" y="303" class="code" text-anchor="middle">airplay_rtsp_main</text>
<text x="560" y="328" class="small" text-anchor="middle">AirPlay 2 dispatch · RAOP fallback</text>

