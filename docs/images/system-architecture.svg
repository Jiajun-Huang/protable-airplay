<path d="M560 162 V247" fill="none" stroke="#60748e" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M560 181 H924 V247" fill="none" stroke="#60748e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="196" y="195" class="small" text-anchor="middle">mDNS · UDP 5353</text>
<text x="560" y="195" class="small" text-anchor="middle">RTSP / encrypted control · TCP 5000</text>
<text x="924" y="195" class="small" text-anchor="middle">UDP/TCP audio · NTP/PTP</text>

<rect x="56" y="249" width="280" height="100" rx="12" fill="#fff" stroke="#d9e2ef"/>
