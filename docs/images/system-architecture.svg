<text x="560" y="128" class="heading white" text-anchor="middle">AirPlay sender</text>
<text x="560" y="150" class="body light" text-anchor="middle">iPhone / compatible AirPlay source</text>

<rect x="36" y="204" width="1048" height="470" rx="16" fill="#edf3fd" stroke="#d3e0f5"/>
<text x="56" y="229" class="label">SHARED C CORE · THREE LONG-RUNNING SERVICES</text>

