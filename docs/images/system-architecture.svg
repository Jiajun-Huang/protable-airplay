<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title description">
<title id="title">AirPlay Speaker system architecture</title><desc id="description">An AirPlay sender communicates with discovery, RTSP, and audio services in the shared C core. The core calls net.h, os.h, and audio.h. A build selects the Windows, Apple, Linux, or embedded backend; platform entry points start the three service threads or tasks.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#60748e"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#18314b} .title{font-size:27px;font-weight:700;letter-spacing:-.4px} .subtitle{font-size:15px;fill:#586d85} .label{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#506886} .heading{font-size:19px;font-weight:700} .body{font-size:14px;fill:#526780} .code{font-family:Consolas,monospace;font-size:13px;fill:#23558c}</style>
<rect width="1120" height="790" rx="24" fill="#f7f9fc"/>
<text x="36" y="45" class="title" text-anchor="start" >One core. Four platform backends.</text>
<text x="36" y="73" class="subtitle" text-anchor="start" >Portable AirPlay receiver · services in shared/ · adapters in platform/</text>
<rect x="828" y="28" width="256" height="53" rx="12" fill="#e8eef9" stroke="#d4dff0"/>
<text x="956" y="50" class="code" text-anchor="middle" >airplay_config.h</text>
<text x="956" y="69" class="body" text-anchor="middle" >Identity · ports · memory · tasks</text>
<rect x="36" y="102" width="1048" height="60" rx="12" fill="#18314b" stroke="#18314b"/>
<text x="560" y="128" class="heading" text-anchor="middle" style="fill:#fff">AirPlay sender</text>
<text x="560" y="150" class="body" text-anchor="middle" style="fill:#c9d8ed">iPhone / compatible AirPlay source</text>
<rect x="36" y="204" width="1048" height="216" rx="16" fill="#edf3fd" stroke="#d3e0f5"/>
<text x="56" y="229" class="label" text-anchor="start" >SHARED C CORE</text>
<path d="M216 163 V174" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  />
<text x="216" y="190" class="body" text-anchor="middle" >mDNS · UDP 5353</text>
<path d="M216 195 V248" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="56" y="250" width="320" height="108" rx="12" fill="#fff" stroke="#d9e2ef"/>
<text x="216" y="279" class="heading" text-anchor="middle" >Discovery</text>
<text x="216" y="307" class="code" text-anchor="middle" >airplay_mdns_main</text>
<text x="216" y="336" class="body" text-anchor="middle" >DNS-SD service records</text>
<path d="M560 163 V174" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  />
<text x="560" y="190" class="body" text-anchor="middle" >RTSP · TCP 5000</text>
<path d="M560 195 V248" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="400" y="250" width="320" height="108" rx="12" fill="#fff" stroke="#d9e2ef"/>
<text x="560" y="279" class="heading" text-anchor="middle" >Session control</text>
<text x="560" y="307" class="code" text-anchor="middle" >airplay_rtsp_main</text>
<text x="560" y="336" class="body" text-anchor="middle" >Session state · SDP · stream control</text>
<path d="M904 163 V174" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  />
<text x="904" y="190" class="body" text-anchor="middle" >Audio · UDP/TCP 6000 · PTP 319/320</text>
<path d="M904 195 V248" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="744" y="250" width="320" height="108" rx="12" fill="#fff" stroke="#d9e2ef"/>
<text x="904" y="279" class="heading" text-anchor="middle" >Audio</text>
<text x="904" y="307" class="code" text-anchor="middle" >airplay_audio_main</text>
<text x="904" y="336" class="body" text-anchor="middle" >RTP · timing · scheduled PCM output</text>
<text x="560" y="389" class="body" text-anchor="middle" >Shared logic: buffering · NTP/PTP · session/audio crypto · ALAC/AAC/PCM</text>
<text x="56" y="449" class="label" text-anchor="start" >INTERFACES</text>
<path d="M216 420 V469" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="56" y="471" width="320" height="77" rx="12" fill="#edf8f6" stroke="#bce0d9"/>
<text x="216" y="500" class="heading" text-anchor="middle" >net.h</text>
<text x="216" y="525" class="body" text-anchor="middle" >TCP / UDP sockets</text>
<path d="M216 549 V565" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  />
<path d="M560 420 V469" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="400" y="471" width="320" height="77" rx="12" fill="#edf8f6" stroke="#bce0d9"/>
<text x="560" y="500" class="heading" text-anchor="middle" >os.h</text>
<text x="560" y="525" class="body" text-anchor="middle" >Mutexes / sleep / UTC time</text>
<path d="M560 549 V565" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  />
<path d="M904 420 V469" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="744" y="471" width="320" height="77" rx="12" fill="#edf8f6" stroke="#bce0d9"/>
<text x="904" y="500" class="heading" text-anchor="middle" >audio.h</text>
<text x="904" y="525" class="body" text-anchor="middle" >PCM output / queued frames</text>
<path d="M904 549 V565" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  />
<path d="M158 565 H962" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  />
<path d="M158 566 V604" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="36" y="606" width="244" height="126" rx="12" fill="#fff" stroke="#d9e2ef"/>
<text x="158" y="635" class="heading" text-anchor="middle" >Windows</text>
<text x="158" y="660" class="code" text-anchor="middle" >windows/net.c</text>
<text x="158" y="687" class="body" text-anchor="middle" >CreateThread · Winsock</text>
<text x="158" y="711" class="body" text-anchor="middle" >waveOut</text>
<path d="M426 566 V604" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="304" y="606" width="244" height="126" rx="12" fill="#fff" stroke="#d9e2ef"/>
<text x="426" y="635" class="heading" text-anchor="middle" >Apple (macOS)</text>
<text x="426" y="660" class="code" text-anchor="middle" >apple/net.c</text>
<text x="426" y="687" class="body" text-anchor="middle" >pthread · BSD sockets</text>
<text x="426" y="711" class="body" text-anchor="middle" >AudioQueue</text>
<path d="M694 566 V604" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="572" y="606" width="244" height="126" rx="12" fill="#fff" stroke="#d9e2ef"/>
<text x="694" y="635" class="heading" text-anchor="middle" >Linux</text>
<text x="694" y="660" class="code" text-anchor="middle" >linux/net.c</text>
<text x="694" y="687" class="body" text-anchor="middle" >pthread · POSIX sockets</text>
<text x="694" y="711" class="body" text-anchor="middle" >ALSA</text>
<path d="M962 566 V604" fill="none" stroke="#60748e" stroke-width="1.8" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="840" y="606" width="244" height="126" rx="12" fill="#fff" stroke="#d9e2ef"/>
<text x="962" y="635" class="heading" text-anchor="middle" >Embedded</text>
<text x="962" y="660" class="code" text-anchor="middle" >embedded/net.c</text>
<text x="962" y="687" class="body" text-anchor="middle" >FreeRTOS · lwIP</text>
<text x="962" y="711" class="body" text-anchor="middle" >Board clock · audio / DMA</text>
<text x="36" y="764" class="body" text-anchor="start" >Each backend owns net.c, os.c and audio.c; its entry point starts the service threads or tasks.</text>
<text x="1084" y="764" class="body" text-anchor="end" >Default ports shown.</text>
</svg>
