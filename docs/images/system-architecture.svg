<path d="M560 551 V568" fill="none" stroke="#60748e" stroke-width="1.8" marker-end="url(#arrow)"/>

<rect x="150" y="570" width="820" height="80" rx="13" fill="#ecfdf7" stroke="#9bd8c5"/>
<text x="560" y="599" class="heading" text-anchor="middle">Shared audio pipeline</text>
<text x="560" y="624" class="code" text-anchor="middle">authenticate/decrypt → reorder/FLUSH → schedule → ALAC/AAC/PCM decode → PCM</text>
<text x="560" y="644" class="small" text-anchor="middle">rtsp_stream_state_t · playout queue · output-delay compensation</text>

<text x="56" y="706" class="label">MINIMAL PLATFORM INTERFACES</text>
